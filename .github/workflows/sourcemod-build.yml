name: SourceMod Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "channel/*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: l4d2-mission-manager-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCEMOD_VERSION: "1.12"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl tar python3 make

      - name: Deps
        run: make deps-linux PYTHON3=python3 SOURCEMOD_VERSION="${SOURCEMOD_VERSION}"

      - name: Build
        run: make build-linux PYTHON3=python3 LINUX_SPCOMP="deps/sourcemod-linux/addons/sourcemod/scripting/spcomp"

      - name: Artifact
        run: |
          python3 ./scripts/stage-artifact.py . ./build-linux ./deps/build-linux-compile.log
          bash ./scripts/ci-validate-artifact.sh

      - name: Resolve artifact metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#channel/}"
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            version="develop"
            release_tag="channel/develop"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            version="latest"
            release_tag="channel/latest"
          else
            version="pr-${GITHUB_SHA::7}"
            release_tag=""
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "basename=l4d2-mission-manager-${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Package zip
        env:
          RELEASE_BASENAME: ${{ steps.meta.outputs.basename }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: bash ./scripts/ci-package-release-assets.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/release/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release asset
        if: steps.meta.outputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          files: dist/release/${{ steps.meta.outputs.basename }}.zip
          draft: false
          prerelease: false
